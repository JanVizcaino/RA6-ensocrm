name: enso-lite

services:
  facial-api:
    build: ./microservicio_facial
    container_name: enso_lite_facial
    restart: unless-stopped
    ports:
      - "8181:5000"
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - enso_lite_deepface_models:/root/.deepface
    # Hardening de seguridad
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    networks:
      - production_net

  db:
    image: postgres:15-alpine
    container_name: enso_lite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-enso_lite_db}
      POSTGRES_USER: ${DB_USERNAME:-enso_lite_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5434:5432"
    volumes:
      - enso_lite_db_data:/var/lib/postgresql/data
    networks:
      - production_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: enso_lite_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - enso_lite_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - production_net

  reverb:
    build:
      context: .
      dockerfile: docker/reverb/Dockerfile
    container_name: enso_lite_reverb
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www/html
    ports:
      - "8765:8080"
    restart: unless-stopped
    depends_on:
      - db
      - rabbitmq
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CACHE_STORE: file
      REVERB_HOST: localhost
      REVERB_PORT: 8080
    networks:
      - production_net

  caddy:
    image: caddy:2-alpine
    container_name: enso_lite_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Soporte para HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    networks:
      - production_net
    depends_on:
      - facial-api

  uptime_kuma:
    image: louislam/uptime-kuma:1
    container_name: enso_lite_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - production_net
  
  duckdns:
      image: lscr.io/linuxserver/duckdns:latest
      container_name: enso_lite_duckdns
      restart: unless-stopped
      environment:
        - SUBDOMAINS=tu-subdominio-aqui  # Solo la parte de antes de .duckdns.org
        - TOKEN=23b6f94f-e49f-4d03-863d-5fc164dbf80b
        - LOG_LEVEL=info
      networks:
        - production_net

volumes:
  enso_lite_deepface_models:
  enso_lite_db_data:
  enso_lite_rabbitmq_data:
  caddy_data:
  caddy_config:
  uptime-kuma-data:

networks:
  production_net:
    driver: bridge